<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JW website showcase</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}iframe{border:0;width:100%;height:100%;display:block}#notice{position:absolute;inset:auto 0 0;background:#111;color:white;font:12px Arial;padding:12px;text-align:center}#notice[hidden]{display:none}</style></head><body><iframe id="site" title="Website design demonstration" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe><p id="notice" hidden>Preview unavailable. Please use the website link outside this demonstration.</p><script>
(()=>{'use strict';const allowed=new Set(['https://jwgrowthanddesign.com','https://www.jwgrowthanddesign.com']);const frame=document.getElementById('site'),notice=document.getElementById('notice');let host=null,ready=false,job=null,raf=0,paused=false,last=0;const kz=location.pathname.split('/').includes('KZ-Disposals');function send(type,extra={}){if(host&&parent!==window)parent.postMessage({channel:'jw-showcase-v1',type,...extra},host)}function stop(){cancelAnimationFrame(raf);job=null;last=0}function step(now){if(!job||paused)return;const delta=last?Math.min(now-last,100):0;last=now;job.elapsed+=delta;const t=Math.min(1,job.elapsed/job.duration),p=job.ease?1-Math.pow(1-t,3):t;frame.contentWindow.scrollTo(0,job.from+(job.to-job.from)*p);if(t<1)raf=requestAnimationFrame(step);else{job=null;send('scrolled')}}function buttonBounds(){const d=frame.contentDocument,a=d.querySelector('#contact a[href^="https://wa.me/"]');if(!a)return null;const r=a.getBoundingClientRect();return {x:r.x+r.width/2,y:r.y+r.height/2,width:innerWidth,height:innerHeight}}function scroll(command){stop();const d=frame.contentDocument,w=frame.contentWindow,el=d.querySelector(kz?'#contact':'#services');if(!el){send('error',{reason:'section-missing'});return}const header=d.querySelector('.header'),offset=kz?20:(header?header.getBoundingClientRect().height+15:20);const base=el.getBoundingClientRect().top+w.scrollY-offset;const max=Math.max(0,d.documentElement.scrollHeight-w.innerHeight);const target=Math.max(0,Math.min(max,base+(command==='detail'?240:0)));job={from:w.scrollY,to:target,duration:command==='detail'?4500:1100,elapsed:0,ease:command!=='detail'};if(!paused)raf=requestAnimationFrame(step)}window.addEventListener('message',event=>{if(event.source!==parent||!allowed.has(event.origin)||!event.data||event.data.channel!=='jw-showcase-v1')return;const action=event.data.action;if(action==='hello'){host=event.origin;send(ready?'ready':'loading');return}if(host!==event.origin||!ready)return;if(action==='reset'){stop();paused=false;frame.contentWindow.scrollTo(0,0);send('reset')}else if(action==='section'||action==='detail')scroll(action);else if(action==='button')send('button',{bounds:buttonBounds()});else if(action==='pause'){paused=true;cancelAnimationFrame(raf);last=0}else if(action==='resume'){paused=false;last=0;if(job)raf=requestAnimationFrame(step)}});frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const style=d.createElement('style');style.textContent='html{scroll-behavior:auto!important}*,*::before,*::after{animation:none!important;transition:none!important}::-webkit-scrollbar{display:none}html{scrollbar-width:none}';d.head.appendChild(style);d.addEventListener('click',e=>{if(e.target.closest('a,button')){e.preventDefault();e.stopImmediatePropagation()}},true);d.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation()},true);d.querySelectorAll('input,textarea,select').forEach(el=>el.disabled=true);frame.contentWindow.scrollTo(0,0);ready=true;notice.hidden=true;send('ready')}catch(error){ready=false;notice.hidden=false;send('error',{reason:'preview-inaccessible'})}});frame.src='./index.html?jw-showcase=1';document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;cancelAnimationFrame(raf);last=0}});
})();
</script></body></html>
